name: Maven CI
# comment to try again
on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Check published coordinates and documentation links
        run: jbang jbang/checkProjectConsistency.java

      - name: Run tests
        run: ./mvnw --no-transfer-progress test

name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Run this workflow from a branch, not a tag." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("pom.xml").getroot()
          version = root.findtext("m:version", namespaces=namespace)
          suffix = "-SNAPSHOT"
          if not version or not version.endswith(suffix):
              raise SystemExit("The root POM version must end in -SNAPSHOT.")
          release = version[:-len(suffix)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release={release}\n")
          PY

      - name: Check release tag
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        shell: bash
        run: |
          existing_release="$(gh release list --limit 1000 --json tagName --jq '.[] | select(.tagName == strenv(RELEASE_VERSION)) | .tagName')"
          if [[ -n "$existing_release" ]]; then
            existing_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_VERSION}" --jq .sha)"
            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_VERSION already points to a different commit." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A release for this commit already exists; it will be reused."
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
              echo "Git tag $RELEASE_VERSION already exists without a matching GitHub Release." >&2
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing key and configure Maven
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s\n' 'pinentry-mode loopback' >> "$HOME/.gnupg/gpg.conf"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          settings_path = Path.home() / ".m2" / "settings.xml"
          tree = ET.parse(settings_path)
          root = tree.getroot()
          namespace = root.tag.split("}", 1)[0].lstrip("{") if "}" in root.tag else ""
          prefix = f"{{{namespace}}}" if namespace else ""
          servers = root.find(f"{prefix}servers")
          if servers is None:
              servers = ET.SubElement(root, f"{prefix}servers")

          server = ET.SubElement(servers, f"{prefix}server")
          ET.SubElement(server, f"{prefix}id").text = os.environ["GPG_KEY_ID"]
          ET.SubElement(server, f"{prefix}password").text = os.environ["GPG_PASSPHRASE"]
          ET.indent(tree, space="  ")
          tree.write(settings_path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Set release versions
        run: ./mvnw --no-transfer-progress -Pcentral versions:set -DremoveSnapshot -DprocessAllModules -DgenerateBackupPoms=false

      - name: Check Maven Central requirements
        run: ./mvnw --no-transfer-progress -Pcentral org.kordamp.maven:pomchecker-maven-plugin:1.14.0:check-maven-central

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: ./mvnw --no-transfer-progress -Pcentral deploy -DignorePublishedComponents=true "-Dgpg.keyname=$GPG_KEY_ID"

      - name: Create GitHub Release
        if: steps.existing_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: gh release create "$RELEASE_VERSION" --title "$RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"

      - name: Set next snapshot versions
        run: ./mvnw --no-transfer-progress -Pcentral versions:set -DnextSnapshot -DprocessAllModules -DgenerateBackupPoms=false

      - name: Commit and push next snapshot
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pom.xml ':(glob)**/pom.xml'
          git commit -m "chore: prepare for next development iteration after $RELEASE_VERSION"
          git push origin "HEAD:$GITHUB_REF"
